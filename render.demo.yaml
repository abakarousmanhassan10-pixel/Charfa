# DEMO preview on Render's FREE plans. NOT staging, NOT production.
# The API runs with APP_ENV=test: simulated AI, simulated social platforms (nothing is posted anywhere), in-memory file
# storage (files vanish on restart), e-mails written to the server log. No real credential is used or needed.
# Free limits: services sleep when idle (slow first load); the free PostgreSQL expires after 30 days.
# Secrets are generated by Render (generateValue) and are never in this file.
databases:
  - name: touma-db
    plan: free
    region: frankfurt
    databaseName: touma_db

services:
  - type: keyvalue
    name: touma-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: touma-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/demo.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: ccr-ce5eb3d1-r4he6g
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: APP_ENV, value: test }
      - { key: API_PORT, value: "10000" }
      - { key: DATABASE_URL, fromDatabase: { name: touma-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: touma-redis, property: connectionString } }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: TOKEN_ENCRYPTION_KEY, generateValue: true }
      - { key: WEB_URL, value: "https://touma-web.onrender.com" }
      - { key: CORS_ORIGINS, value: "https://touma-web.onrender.com" }
      - { key: PUBLIC_API_URL, value: "https://touma-api.onrender.com" }
      - { key: STORAGE_DRIVER, value: memory }
      - { key: AI_PROVIDER, value: fake }
      - { key: IMAGE_PROVIDER, value: fake }
      - { key: VIDEO_PROVIDER, value: fake }
      - { key: SOCIAL_PROVIDER_MODE, value: fake }
      - { key: SOCIAL_PUBLISHING_ENABLED, value: "true" }
      - { key: SOCIAL_COMMENTS_ENABLED, value: "true" }
      - { key: SOCIAL_COMMENT_REPLIES_ENABLED, value: "true" }
      - { key: AI_WORKER_INLINE, value: "true" }
      - { key: RATE_LIMIT_STORE, value: redis }
      - { key: EMAIL_TRANSPORT, value: log }
      - { key: ORCHESTRATOR_ENABLED, value: "true" }
      - { key: WORKFLOWS_ENABLED, value: "true" }
      - { key: MARKET_INTELLIGENCE_ENABLED, value: "true" }
      - { key: SALES_ASSIST_ENABLED, value: "true" }

  - type: web
    name: touma-web
    runtime: node
    plan: free
    region: frankfurt
    branch: ccr-ce5eb3d1-r4he6g
    autoDeployTrigger: "off"
    buildCommand: npm install -g pnpm@10.28.0 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@touma/web...
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: API_URL, value: "https://touma-api.onrender.com" }
