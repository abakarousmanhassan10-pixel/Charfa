# Local infrastructure + full stack.
#   Infra only:   pnpm infra:up
#   Full stack:   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up --build
name: touma

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: touma
      POSTGRES_PASSWORD: touma_dev_password
      POSTGRES_DB: touma
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touma -d touma"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development (phase 4 media).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: touma-minio
      MINIO_ROOT_PASSWORD: touma-minio-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://touma:touma_dev_password@postgres:5432/touma?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [app]

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile, target: runtime }
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://touma:touma_dev_password@postgres:5432/touma?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      APP_ENV: development
      COOKIE_SECURE: "false"
      # Local MinIO (S3-compatible). The bucket is created on first upload.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: touma-media
      S3_ACCESS_KEY_ID: touma-minio
      S3_SECRET_ACCESS_KEY: touma-minio-dev-password
      S3_FORCE_PATH_STYLE: "true"
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    profiles: [app]

  worker:
    build: { context: ../.., dockerfile: infrastructure/docker/worker.Dockerfile }
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://touma:touma_dev_password@postgres:5432/touma?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    profiles: [app]

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { API_URL: http://api:4000 }
    ports: ["3000:3000"]
    depends_on: [api]
    profiles: [app]

volumes:
  pgdata:
  redisdata:
  miniodata:
