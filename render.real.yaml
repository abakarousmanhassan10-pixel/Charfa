# REAL (non-demo) deployment on PAID Render plans. NOT applied until you review the plan and enter your own keys in the Render dashboard.
# No secret is in this file: every `sync: false` value is asked for by Render when the Blueprint is approved. Secrets generated by Render
# (JWT, token encryption) use generateValue. The app starts with APP_ENV=production, which refuses to start with simulated providers,
# in-memory storage, console e-mails or unscanned uploads.
#
# What is real here: PostgreSQL, Redis, e-mail (your SMTP provider), file storage (your S3-compatible bucket, e.g. Cloudflare R2),
# malware scanning (ClamAV) and AI text (your OpenAI key).
# What is deliberately OFF: social platforms (no developer application approved yet: cards show "not configured"), image/video AI,
# and the modules that only have simulated adapters (workflows, market, campaigns, intelligence, sales assist). They stay off so the
# product never presents simulated results as real.
# Plan ids follow Render's Blueprint specification; Render's planning step rejects an invalid one before anything is created.
databases:
  - name: touma-real-db
    plan: basic-256mb
    region: frankfurt
    databaseName: touma
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: touma-real-redis
    plan: 256mb
    region: frankfurt
    maxmemoryPolicy: noeviction # BullMQ requirement
    ipAllowList: [] # internal URL only

  - type: pserv
    name: touma-real-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.4
    plan: 1c-2g
    region: frankfurt
    envVars:
      - { key: CLAMD_CONF_StreamMaxLength, value: 60M }
      - { key: CLAMD_CONF_MaxFileSize, value: 60M }
    disk:
      name: clamav-signatures
      mountPath: /var/lib/clamav
      sizeGB: 2

  - type: web
    name: touma-real-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/app.Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: frankfurt
    branch: ccr-ce5eb3d1-r4he6g
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: APP_ENV, value: production }
      - { key: API_PORT, value: "10000" }
      - { key: DATABASE_URL, fromDatabase: { name: touma-real-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: touma-real-redis, property: connectionString } }
      - { key: CLAMAV_HOST, fromService: { type: pserv, name: touma-real-clamav, property: host } }
      - { key: CLAMAV_PORT, value: "3310" }
      - { key: MALWARE_SCANNER, value: clamav }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: TOKEN_ENCRYPTION_KEY, generateValue: true }
      - { key: WEB_URL, value: "https://touma-real-web.onrender.com" }
      - { key: CORS_ORIGINS, value: "https://touma-real-web.onrender.com" }
      - { key: PUBLIC_API_URL, value: "https://touma-real-api.onrender.com" }
      - { key: RATE_LIMIT_STORE, value: redis }
      - { key: AI_WORKER_INLINE, value: "true" } # workers run inside the API process: fine for one instance
      - { key: AI_PROVIDER, value: openai }
      - { key: OPENAI_ENABLED, value: "false" } # switch to "true" in the dashboard only when you want real OpenAI calls
      - { key: IMAGE_PROVIDER, value: none }
      - { key: VIDEO_PROVIDER, value: none }
      - { key: SOCIAL_PROVIDER_MODE, value: live } # no platform credentials: nothing can be connected or published
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_PROVIDER, value: r2 }
      - { key: S3_REGION, value: auto }
      - { key: S3_AUTO_CREATE_BUCKET, value: "false" }
      - { key: EMAIL_TRANSPORT, value: smtp }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_SECURE, value: "false" }
      # Entered by you in the Render dashboard (never in this file, never in the chat):
      - { key: OPENAI_API_KEY, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: EMAIL_FROM, sync: false }

  - type: web
    name: touma-real-web
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: ccr-ce5eb3d1-r4he6g
    autoDeployTrigger: "off"
    buildCommand: npm install -g pnpm@10.28.0 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@touma/web...
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: API_URL, value: "https://touma-real-api.onrender.com" }
